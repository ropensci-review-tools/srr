# HOWTO generate personal token on codeberg:
#   1. Personal settings -> Applications -> Generate new token
#   2. Grant access to repo read/write
#
# Store all necessary variables as secrets, including passwords with secret
# names as specified below:
# - UNAME for git remote basic-auth username
# - CODEBERG for codeberg.org token
# - CODEFLOW for codeflow.com token
#
# Mirroring itself is implemented by the ropensci-review-tools/actions
# push-to-elsewhere composite action; see
# https://github.com/ropensci-review-tools/actions/tree/main/push-to-elsewhere

name: push-to-elsewhere

# Mirror pushes must run one-at-a-time: two near-simultaneous pushes to
# main race each other and the loser fails with "cannot lock ref
# refs/heads/main" on the mirror remote (seen 2026-07-21).
concurrency:
  group: push-to-elsewhere
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  push-to-elsehwere:
    runs-on: ubuntu-latest

    steps:
    # will only push *from* main; on PRs the job completes as a no-op
    # so the check reads green instead of skipped
    - name: Mirror main
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: ropensci-review-tools/actions/push-to-elsewhere@v2
      with:
        mirrors: |
          codeberg=https://${{ secrets.UNAME }}:${{ secrets.CODEBERG }}@codeberg.org/ropensci-review-tools/srr.git
          codeflow=https://${{ secrets.UNAME }}:${{ secrets.CODEFLOW }}@codeflow.com/ropensci-review-tools/srr.git
