# HOWTO generate personal token on codeberg:
#   1. Personal settings -> Applications -> Generate new token
#   2. Grant access to repo read/write
#
# TODO on github:
# Store all necessary variables as secrets, including passwords with secret
# names as specified below:
# - UNAME, EMAIL for git config
# - CODEBERG for codeberg.org token
# - CODEFLOW for codeflow.com token

name: push-to-elsewhere

# Mirror pushes must run one-at-a-time: two near-simultaneous pushes to
# main race each other and the loser fails with "cannot lock ref
# refs/heads/main" on the mirror remote (seen 2026-07-21).
concurrency:
  group: push-to-elsewhere
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  push-to-elsehwere:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # will only push *from* main; on PRs the job completes as a no-op
    # so the check reads green instead of skipped
    - name: Mirror main
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
          git config --global user.name "ropensci"
          git config --global user.email "noreply@ropensci.org"
          git clone https://github.com/ropensci-review-tools/srr.git
          git fetch --unshallow origin
          git remote add codeberg https://${{secrets.UNAME}}:${{secrets.CODEBERG}}@codeberg.org/ropensci-review-tools/srr.git
          git push --tags codeberg main
          git remote add codefloe https://${{secrets.UNAME}}:${{secrets.CODEFLOE}}@codefloe.com/ropensci-review-tools/srr.git
          git push --tags codefloe main
